    <main>
        <h2>Formulário</h2>

        <section>
            <article>
                <form action="formulario.php" method="POST">
                    <label for="data">Data do dia:</label>
                    <input type="date" id="data" name="data" placeholder="Data do dia" required><br><br>

                    <label for="arquivo">Curriculo de trabalho:</label>
                    <input type="file" id="arquivo" name="arquivo" placeholder="arquivo aqui" required><br><br>

                    <label for="barra">Barra de audio:</label>
                    <input type="range" id="barra" name="barra" placeholder="barra aqui" required><br><br>

                    <label for="protagonista">Protagonista favorito:</label>
                    <input list="protagonista" placeholder="protagonista" required><br><br>

                    <datalist id="protagonista" name="protagonista" required>
                        <option value="">Selecione</option>
                        <option value="Luffy">Luffy</option>
                        <option value="Naruto">Naruto</option>
                        <option value="Ichigo">Ichigo</option>
                    </datalist>

                    <input type="submit" value="Enviar">
                </form>
            </article>
        </section>
    </main>

    <aside>
        <p><del>Tive dificuldade para colocar estrutura semantica completa em todas as paginas</del></p>
